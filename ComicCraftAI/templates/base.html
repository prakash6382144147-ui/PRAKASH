<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ComicCraft{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --accent: #fbbf24;
      --accent-2: #f59e0b;
      --text: #e5e7eb;
      --muted: #cbd5e1;
      --danger: #f87171;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg), #111827);
      color: var(--text);
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .hero {
      padding: 32px 0 24px;
    }

    .eyebrow {
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 12px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.2rem, 4vw, 4rem);
    }

    .lead {
      max-width: 680px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1.1rem;
    }

    .card {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .full { grid-column: 1 / -1; }

    label {
      display: grid;
      gap: 8px;
      font-weight: 600;
    }

    input, textarea, select, button {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #111827;
      font-weight: 800;
      cursor: pointer;
      border: none;
    }

    .alert {
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.5);
      color: #fecaca;
      border-radius: 12px;
      padding: 16px;
      margin: 20px 0;
    }

    .hint {
      color: var(--muted);
      margin-top: 18px;
      line-height: 1.6;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .panel-card {
      background: rgba(17, 24, 39, 0.8);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .panel-card img {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #111827;
    }

    .panel-content {
      padding: 16px;
    }

    .panel-content h3 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .panel-content p {
      color: var(--muted);
      line-height: 1.55;
      margin: 0;
    }

    .download-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 18px;
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #062b1d;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
