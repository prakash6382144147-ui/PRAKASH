<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ComicCraft{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #08111d;
            color: #edf3ff;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }
        .hero {
            padding: 40px 0 24px;
        }
        .eyebrow {
            color: #8ec5ff;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-size: 12px;
            margin-bottom: 10px;
        }
        h1 { font-size: clamp(2.2rem, 5vw, 4rem); margin: 0 0 12px; }
        .lead { color: #d3d9e4; max-width: 680px; line-height: 1.6; }
        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.25);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }
        label { display: flex; flex-direction: column; gap: 8px; color: #dfeafc; }
        input, select, textarea, button {
            font: inherit;
            border-radius: 10px;
            border: 1px solid rgba(148,163,184,0.45);
            background: rgba(15, 23, 42, 0.8);
            color: #edf3ff;
            padding: 12px 14px;
        }
        textarea { min-height: 120px; resize: vertical; }
        .full { grid-column: 1 / -1; }
        .button {
            display: inline-flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            color: white; border: none; cursor: pointer; font-weight: 700; text-decoration: none;
        }
        .hint { color: #b6c2d4; margin-top: 18px; }
        .alert { background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.4); color: #fecaca; padding: 12px 14px; border-radius: 10px; margin: 22px 0; }
        .preview-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;
            margin-top: 30px;
        }
        .panel-card {
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(148,163,184,0.25); border-radius: 16px; overflow: hidden;
        }
        .panel-card img { width: 100%; display: block; height: 260px; object-fit: cover; }
        .panel-card .text { padding: 16px 18px 18px; }
        .panel-card h3 { margin: 0 0 8px; }
        .panel-card p { margin: 0; color: #dfeafc; line-height: 1.5; }
        .download-link { display: inline-block; margin-top: 18px; padding: 12px 16px; border-radius: 10px; background: #0ea5e9; color: white; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
